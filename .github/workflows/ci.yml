name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Build-time only placeholders: every page is dynamic (it reads cookies),
    # so nothing connects to these during `next build`. Real values live in
    # Vercel and are never committed.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Migration chain
        # Applies the whole Drizzle journal to an in-process Postgres and fails
        # if a file is missing, if any statement errors, or if a column in
        # schema.ts has no migration. Needs no database and no credentials.
        run: npm run db:check-chain

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        # Dev-only tooling advisories are reported by Dependabot instead of
        # failing the build; anything reachable in production must be clean.
        run: npm audit --omit=dev --audit-level=high
